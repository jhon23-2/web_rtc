services:
  - type: web
    name: web-rtc-app
    env: node
    plan: free
    buildCommand: npm install && npm run build-client
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVER_PORT
        value: 10000
      - key: CLIENT_URL
        fromService:
          type: web
          name: web-rtc-app
          property: url

