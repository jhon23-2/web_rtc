services:
  - type: web
    name: web-rtc-app
    env: node
    plan: free
    buildCommand: npm install && npm run build-client
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVER_PORT
        value: 10000
      # CLIENT_URL will be set manually after deployment
      # Or can be omitted since socket auto-detects same origin